<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | JobKG</title>
  <meta name="description" content="Вход в личный кабинет JobKG (демонстрационная форма).">
  <meta name="theme-color" content="#2563EB">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JobKG">
  <meta property="og:title" content="Вход | JobKG">
  <meta property="og:description" content="Вход в личный кабинет JobKG (демонстрационная форма).">
  <meta property="og:image" content="assets/images/hero-team.jpeg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/i18n.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/filters.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/companies.js"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/employer.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/contact.js"></script>
</head>
<body data-page="login" data-nav="login" data-title="meta.login.title" data-desc="meta.login.desc">
  <a class="skip-link" href="#main" data-i18n="nav.skip">Перейти к содержимому</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <noscript><div class="container section"><p>Для работы сайта включите JavaScript. / Сайттын иштеши үчүн JavaScript'ти иштетиңиз.</p></div></noscript>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1 data-i18n="login.title">Вход</h1>
        <p class="text-muted" data-i18n="login.lead">Войдите, чтобы пользоваться личным кабинетом.</p>
        <form class="form-card" id="login-form" novalidate>
          <div class="notice notice-warn mb-4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg><p data-i18n="auth.demoNotice">Демо: аккаунты не создаются, пароли не передаются и не сохраняются. Для настоящей авторизации нужна серверная часть.</p></div>
          <div class="field">
            <label for="l-email"><span data-i18n="login.email">Электронная почта</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="l-email" name="email" type="email" autocomplete="email" maxlength="120" required aria-describedby="l-email-err">
            
            <span class="error" id="l-email-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="l-pass"><span data-i18n="login.pass">Пароль</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="l-pass" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="l-pass-err">
            
            <span class="error" id="l-pass-err" aria-live="polite"></span>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" data-i18n="login.submit">Войти</button>
          <div id="login-result" role="status" aria-live="polite"></div>
        </form>
        <p class="auth-foot"><span data-i18n="login.noAccount">Нет аккаунта?</span> <a href="register.html" data-i18n="nav.register">Регистрация</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
