<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация | JobKG</title>
  <meta name="description" content="Регистрация соискателя или работодателя на JobKG (демонстрационная форма).">
  <meta name="theme-color" content="#2563EB">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JobKG">
  <meta property="og:title" content="Регистрация | JobKG">
  <meta property="og:description" content="Регистрация соискателя или работодателя на JobKG (демонстрационная форма).">
  <meta property="og:image" content="assets/images/hero-team.jpeg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/i18n.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/filters.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/companies.js"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/employer.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/contact.js"></script>
</head>
<body data-page="register" data-nav="register" data-title="meta.register.title" data-desc="meta.register.desc">
  <a class="skip-link" href="#main" data-i18n="nav.skip">Перейти к содержимому</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <noscript><div class="container section"><p>Для работы сайта включите JavaScript. / Сайттын иштеши үчүн JavaScript'ти иштетиңиз.</p></div></noscript>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1 data-i18n="register.title">Регистрация</h1>
        <p class="text-muted" data-i18n="register.lead">Создайте аккаунт соискателя или работодателя.</p>
        <form class="form-card" id="register-form" novalidate>
          <div class="notice notice-warn mb-4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg><p data-i18n="auth.demoNotice">Демо: аккаунты не создаются, пароли не передаются и не сохраняются. Для настоящей авторизации нужна серверная часть.</p></div>
          <fieldset style="border:0;padding:0;margin:0 0 var(--s-4)">
            <legend class="label" style="font-size:var(--fs-sm);font-weight:600;margin-bottom:var(--s-2)" data-i18n="register.role">Я —</legend>
            <div class="role-switch" style="margin-bottom:0">
              <label><input type="radio" name="role" id="role-seeker" value="seeker" checked><span data-i18n="register.seeker">Соискатель</span></label>
              <label><input type="radio" name="role" id="role-employer" value="employer"><span data-i18n="register.employer">Работодатель</span></label>
            </div>
          </fieldset>
          <div class="field">
            <label for="r-name"><span data-i18n="register.name">Имя</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="r-name" name="name" type="text" autocomplete="name" maxlength="100" required aria-describedby="r-name-err">
            
            <span class="error" id="r-name-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-email"><span data-i18n="register.email">Электронная почта</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="r-email" name="email" type="email" autocomplete="email" maxlength="120" required aria-describedby="r-email-err">
            
            <span class="error" id="r-email-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-pass"><span data-i18n="register.pass">Пароль</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="r-pass" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="r-pass-err">
            <span class="hint" data-i18n="register.passHint">Не короче 8 символов</span>
            <span class="error" id="r-pass-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="r-pass2"><span data-i18n="register.pass2">Повторите пароль</span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="r-pass2" name="password2" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="r-pass2-err">
            
            <span class="error" id="r-pass2-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label class="check" for="r-agree"><input type="checkbox" id="r-agree" name="agree" aria-describedby="r-agree-err"><span data-i18n="register.agree">Я ознакомлен(а) с политикой конфиденциальности и условиями использования (документы будут добавлены)</span></label>
            <span class="error" id="r-agree-err" aria-live="polite"></span>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" data-i18n="register.submit">Создать аккаунт</button>
          <div id="register-result" role="status" aria-live="polite"></div>
        </form>
        <p class="auth-foot"><span data-i18n="register.have">Уже есть аккаунт?</span> <a href="login.html" data-i18n="nav.login">Войти</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
